name: Crawl Daily Season and Culture Data

on:
  schedule:
    # Cloudflare workflow_dispatch 장애 시 데이터 수집 공백을 막는 임시 예비 스케줄
    # KST 매일 06:30·10:30·14:30·18:30·22:30
    - cron: '30 1,5,9,13,21 * * *'
  workflow_dispatch:

concurrency:
  group: traffic-catcher-data-updates
  cancel-in-progress: false

jobs:
  crawl-daily-discovery:
    # Cloudflare 호출과 GitHub 임시 예비 스케줄을 모두 허용한다.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Daily Season and Culture Crawler
      env:
        TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
        KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      run: python portal_crawler.py --discovery-only
    - name: Commit and Push Daily Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add season_events.json movie_releases.json performances.json netflix_top10.json
        if git diff --staged --quiet; then
          echo "일정형 데이터 변경 사항 없음."
        else
          git commit -m "data: update daily season and culture data"
          git push
          echo "일일 시즌·문화·OTT 데이터 갱신 완료."
        fi
