name: Crawl Daily Season and Culture Data

on:
  workflow_dispatch:

concurrency:
  group: traffic-catcher-data-updates
  cancel-in-progress: false

jobs:
  crawl-daily-discovery:
    # Cloudflare Cron Scheduler 또는 GitHub UI의 수동 호출만 허용한다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        persist-credentials: true
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Daily Season and Culture Crawler
      env:
        TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
        KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      run: python portal_crawler.py --discovery-only
    - name: Upload Discovery Data to Cloudflare KV and R2
      id: cloudflare_upload
      env:
        TRAFFIC_DATA_INGEST_URL: https://trafficcatcher.ai
        TRAFFIC_DATA_INGEST_TOKEN: ${{ secrets.TRAFFIC_DATA_INGEST_TOKEN }}
      shell: bash
      run: |
        set +e
        python scripts/upload_cloudflare_data.py --group discovery
        upload_exit=$?
        set -e
        if [ "$upload_exit" -eq 0 ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        elif [ "$upload_exit" -eq 2 ]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Cloudflare 저장소 설정 전이므로 GitHub 파일 커밋 방식으로 임시 폴백합니다."
        else
          exit "$upload_exit"
        fi
    - name: Transitional Git Commit Fallback
      if: steps.cloudflare_upload.outputs.enabled != 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add season_events.json movie_releases.json performances.json netflix_top10.json
        if git diff --staged --quiet; then
          echo "일정형 데이터 변경 사항 없음."
        else
          git commit -m "data: update daily season and culture data"
          git push
          echo "Cloudflare 저장소 설정 전 임시 GitHub 데이터 커밋을 완료했습니다."
        fi
