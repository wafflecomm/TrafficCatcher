name: Crawl Portal Trends and Deploy

on:
  schedule:
    # 한국 시간(KST) 06:17~23:17에 매시간 실행하고 00:00~05:59에는 실행하지 않음
    # GitHub Actions cron은 UTC 기준이므로 KST 운영 시간을 UTC 21~23시 및 00~14시로 환산
    - cron: '17 0-14,21-23 * * *'
  workflow_dispatch:
    # GitHub 웹 UI에서 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  crawl-and-commit:
    # Repository variable AUTO_CRAWL_ENABLED=false이면 예약 실행만 중지한다.
    # workflow_dispatch 수동 실행은 자동 수집 OFF 상태에서도 항상 허용한다.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_CRAWL_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Portal Crawler
      env:
        TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
      run: |
        python portal_crawler.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 변경 사항 검사 (수집 데이터 파일 일체 포함)
        git add realtime_trends.csv trends.json signal_realtime_keywords.csv broadcast_top5.json season_events.json
        
        # 커밋할 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "수집 데이터 변경 사항 없음."
        else
          git commit -m "data: update portal trends"
          git push
          echo "수집 데이터가 성공적으로 깃허브에 커밋 및 푸시되었습니다. ✅"
        fi
