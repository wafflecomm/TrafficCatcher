name: Crawl Portal Trends and Deploy

on:
  schedule:
    # Cloudflare Pages Free 월 500회 계정 공유 한도를 고려해 2시간마다 실행 (월 약 360회)
    # GitHub Actions 정각 혼잡을 피해 UTC 기준 짝수 시간 17분에 실행
    - cron: '17 */2 * * *'
  workflow_dispatch:
    # GitHub 웹 UI에서 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  crawl-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Portal Crawler
      run: |
        python portal_crawler.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # 변경 사항 검사 (수집 데이터 파일 일체 포함)
        git add realtime_trends.csv trends.json signal_realtime_keywords.csv
        
        # 커밋할 변경사항이 있는지 확인
        if git diff --staged --quiet; then
          echo "수집 데이터 변경 사항 없음."
        else
          git commit -m "data: update portal trends"
          git push
          echo "수집 데이터가 성공적으로 깃허브에 커밋 및 푸시되었습니다. ✅"
        fi
