name = "trafficcatcher-scheduler"
main = "cloudflare-scheduler/worker.js"
compatibility_date = "2026-04-01"
workers_dev = true

[vars]
GITHUB_OWNER = "wafflecomm"
GITHUB_REPOSITORY = "TrafficCatcher"
GITHUB_REF = "main"

[triggers]
# Cloudflare Cron Trigger는 UTC 기준입니다.
# */10 * * * * = KST 포함 전 세계 기준 24시간 매 10분
# 30 1,5,9,13,21 * * * = KST 매일 06:30·10:30·14:30·18:30·22:30
crons = ["*/10 * * * *", "30 1,5,9,13,21 * * *"]

[observability]
enabled = true
